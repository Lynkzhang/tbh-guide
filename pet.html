<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>宠物 - TBH攻略站</title>
<style>
:root{--bg:#f5f5f5;--card:#fff;--hd:#e8e8e8;--ac:#e94560;--tx:#333;--mu:#666;--bl:#3498db;--gn:#2ecc71}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Microsoft YaHei',sans-serif;background:var(--bg);color:var(--tx);line-height:1.7}
.c{max-width:1200px;margin:0 auto;padding:16px}
.topnav{background:linear-gradient(135deg,#2c2c3e,#1a1a2e);padding:0;position:sticky;top:0;z-index:200;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.topnav-inner{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:0}
.topnav .logo{color:#ffd700;font-weight:bold;font-size:.95em;padding:12px 20px;white-space:nowrap;text-decoration:none;border-right:1px solid rgba(255,255,255,.1)}
.topnav ul{list-style:none;display:flex;flex-wrap:wrap;gap:0;flex:1}
.topnav ul li a{display:block;color:rgba(255,255,255,.75);padding:12px 16px;font-size:.85em;text-decoration:none;white-space:nowrap;transition:background .15s,color .15s}
.topnav ul li a:hover,.topnav ul li a.active{background:rgba(255,255,255,.1);color:#ffd700}
header{background:linear-gradient(135deg,#667eea,#764ba2);padding:28px 20px;border-radius:12px;margin-bottom:20px;text-align:center}
header h1{color:#fff;font-size:1.8em}
header p{color:rgba(255,255,255,.8);font-size:.85em;margin-top:4px}
.s{background:var(--card);padding:18px;border-radius:10px;margin-bottom:18px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.s h2{color:var(--ac);border-bottom:2px solid var(--hd);padding-bottom:8px;margin-bottom:14px;font-size:1.2em}
.s h3{color:var(--bl);margin:14px 0 8px;font-size:1em}
table{width:100%;border-collapse:collapse;margin:10px 0;font-size:.8em}
th,td{padding:6px 8px;border:1px solid #ddd;text-align:left}
th{background:var(--hd);color:var(--tx)}
tr:nth-child(even){background:#f9f9f9}
tr:hover{background:#f0f0f0}
.n{background:#fff3cd;padding:10px 14px;border-left:3px solid #ffc107;margin:10px 0;border-radius:0 6px 6px 0;font-size:.85em;color:#856404}
.n b{color:#856404}
.search{background:var(--card);padding:16px;border-radius:10px;margin-bottom:20px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.search input{width:100%;padding:10px;border:1px solid #ddd;border-radius:5px;background:#fff;color:var(--tx);font-size:1em}
.search input:focus{outline:none;border-color:var(--ac)}
.result{background:#f8f9fa;padding:12px;border-radius:8px;margin-top:10px;border:1px solid #ddd}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.cardlink{display:block;background:var(--card);padding:16px;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.08);text-decoration:none;color:var(--tx);border:1px solid transparent}
.cardlink:hover{border-color:var(--ac);transform:translateY(-1px)}
.cardlink h3{color:var(--ac);margin-bottom:6px;font-size:1.05em}
.cardlink p{font-size:.85em;color:var(--mu)}
footer{text-align:center;padding:16px;color:var(--mu);font-size:.75em;margin-top:30px}
.c-common{color:#888}.c-uncommon{color:#3b7b1d}.c-rare{color:#21528e}.c-legendary{color:#904503}.c-immortal{color:#8c1818}.c-arcana{color:#652284}.c-beyond{color:#8f1e45}.c-celestial{color:#0e9aa7}.c-divine{color:#d4a017}.c-cosmic{color:#6c2f1f}
@media(max-width:768px){.topnav ul li a{padding:10px 10px;font-size:.8em}table{font-size:.7em}}
</style>
</head>

</html>
