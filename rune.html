<style>
:root{--bg:#f5f5f5;--card:#fff;--ac:#e94560;--tx:#333;--mu:#666;--bl:#3498db}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Microsoft YaHei',sans-serif;background:var(--bg);color:var(--tx);padding:20px}

svg{max-width:100%;height:auto}
.legend{background:var(--card);padding:15px;border-radius:10px;margin-top:20px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.legend-item{display:inline-block;margin:5px 10px;font-size:.85em}
.legend-color{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:middle}
.tooltip{position:absolute;background:#333;color:#fff;padding:8px 12px;border-radius:6px;font-size:.8em;pointer-events:none;z-index:100;white-space:nowrap}
</style>

        tooltip.style.left = (e.clientX + 10) + 'px';
        tooltip.style.top = (e.clientY + 10) + 'px';
        tooltip.innerHTML = '<b>' + found.name + '</b> Lv' + found.level + '<br>' + found.effect;
    } else {
        tooltip.style.display = 'none';
    }
});

svgEl.addEventListener('mouseleave', function() {
    tooltip.style.display = 'none';
});
</script>
</body>
</html>
