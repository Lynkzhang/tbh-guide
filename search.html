<header><h1>素材查询</h1><p>输入素材名，查看掉落来源和概率</p></header>
<div class="s" id="search">

<h2>素材去哪刷</h2>

<div class="search">

<input type="text" id="si" placeholder="输入素材名称，如：木材、铁锭、黑曜石碎片" onkeyup="doSearch()">

<div id="sr" class="result" style="display:none"></div>

</div>

<div class="n"><b>使用方法</b>：输入素材中文名，显示掉落来源和概率。物品名颜色=稀有度。</div>

</div>

<footer><p>数据来源：游戏文件解析 | 提取工具：UnityPy | 最后更新：2026-06-05</p></footer>
</div>

<script src="data_items.js"></script>
<script src="data_search.js"></script>
<script>
function gc(g) {
    var m={'COMMON':'c-common','UNCOMMON':'c-uncommon','RARE':'c-rare','LEGENDARY':'c-legendary','IMMORTAL':'c-immortal','ARCANA':'c-arcana','BEYOND':'c-beyond','CELESTIAL':'c-celestial','DIVINE':'c-divine','COSMIC':'c-cosmic'};
    return m[g]||'';
}
var RARITY_CN={'COMMON':'普通','UNCOMMON':'罕见','RARE':'稀有','LEGENDARY':'传奇','IMMORTAL':'不朽','ARCANA':'至宝','BEYOND':'超凡','CELESTIAL':'天界','DIVINE':'神圣','COSMIC':'宇宙'};
function cn(id,name) {
    var c=gc(GRADES[id]);
    return c?'<span class="'+c+'">'+name+'</span>':name;
}
function doSearch() {
    var q=document.getElementById('si').value.toLowerCase().trim();
    var r=document.getElementById('sr');
    if(q.length<1){r.style.display='none';return;}
    var ms=[];
    for(var id in ITEMS){if(ITEMS[id].toLowerCase().includes(q))ms.push({id:id,name:ITEMS[id]});}
    if(ms.length===0){r.innerHTML='<p>未找到</p>';r.style.display='block';return;}
    var h='';
    for(var i=0;i<Math.min(ms.length,10);i++){
        var m=ms[i];
        h+='<div style="margin:10px 0;padding:10px;background:#fff;border-radius:5px;border:1px solid #ddd">';
        var rn=RARITY_CN[GRADES[m.id]]||'';
        h+='<b>'+cn(m.id,m.name)+'</b>'+(rn?' <span style="font-size:0.8em;color:#888">['+rn+']</span>':'');
        var drops=SEARCH_ITEMS[m.id];
        if(drops&&drops.length>0){
            h+='<br><b>掉落来源（按概率排序）：</b><table><thead><tr><th>关卡</th><th>等级</th><th>宝箱类型</th><th>概率</th></tr></thead><tbody>';
            var added = 0;
            for(var j=0;j<Math.min(drops.length,15);j++){
                var d=drops[j];
                var stages=DROP_STAGES[d.dk];
                if(stages){
                    for(var k=0;k<Math.min(stages.length,3);k++){
                        var s=stages[k];
                        h+='<tr><td>'+s.stage+'</td><td>Lv'+s.level+'</td><td>'+s.type+'</td><td>'+d.pct+'%</td></tr>';
                        added++;
                    }
                } else {
                    h+='<tr><td>-</td><td>-</td><td>掉落表 '+d.dk+'</td><td>'+d.pct+'%</td></tr>';
                    added++;
                }
            }
            if(!added){
                h+='<tr><td colspan="4" style="color:#888">该物品已找到，但掉落关卡映射缺失</td></tr>';
            }
            h+='</tbody></table>';
        }else{
            h+='<br><span style="color:#888">暂无掉落数据</span>';
        }
        h+='</div>';
    }
    r.innerHTML=h;
    r.style.display='block';
}
document.addEventListener('DOMContentLoaded',function(){
    document.querySelectorAll('.g').forEach(function(el){
        var ik=el.getAttribute('data-ik');
        if(ik&&GRADES[ik]){var c=gc(GRADES[ik]);if(c)el.className='g '+c;}
    });
});
</script>

</body>
